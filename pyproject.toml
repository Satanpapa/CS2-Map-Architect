[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-map-architect"
version = "0.2.0"
description = "Local toolkit for designing competitive CS2 maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cs2_map_architect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
